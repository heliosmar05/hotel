<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <link href="https://cdn.jsdelivr.net/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient">
        <div class="container-fluid">
            <a class= "navbar-brand fw-bold text-white" href="/">🏨 Hotel Caribe Azul</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collepse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active text-white" href="/">🏠 Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <a class= "nav-link text-white"href="/consulta">🔍 Consultar</a>

        <div>
            <div class="col-md-6">
                <label class="form-label"> Nome:</label>
                <input type="text"class="form-controol" name="nome" required>
            </div>
        </div>
        <div>
            <div class="col-md-6">
                <label class="form-label"> CPF:</label>
                <input type="text" class="form-control" name="cpf" required>
            </div>
        </div>

        <div>
            <div class="col-md-6">
                <label class="form-label"> Email:</label>
                <input type="email"  class="form-label" name="email" required>
            </div>
        </div>
        <div>
            <div class="col-md-6">
                <label class="form-label"> Telefone:</label>
                <input type="text" class="form-control" name="telefone" required>
            </div>
        </div>

        <div>
            <div class="col-12">
                <label class="form-label"> Endereço:</label>
                <input type="text" class="form-control" name="endereco" required>
            </div>
        </div>

        <div>
            <div class="col-12">
                <label class="form-control"> Observação:</label>
                <textarea class="form-control" name="observacao" rows="2"></textarea>
            </div>
        </div>
        <header>
            
            <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-inner active">
                        <ing src="assets/images/banner1.png" class="d-block W-100" alt="Banner1">
                        </div>
                        <div class="carousel-item">
                            <ing src="assets/images/banner2.png" class="d-block W-100" alt="Banner2">
                        </div>
                        <div class="carousel-item">
                            <img src="assets/images/banner3.png" class="d-block W-100" alt="Banner3">
                        </div>
                    </div>
                 </div>
            </div>
        </header>
        <button type="submit"class="btn-primary" >Cadastrar</button>
    </form>
        
    <div id="mensagem" class="mt-3 text-center fw-bold"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    
    <footer class="text-center mt-5 p-3 text-white bg-dark">
        <p> sistema de Cadastro | Desenvolvido para fins didáticos</p>
    </footer>
    <p id="clock">11:49:29</p>
    <script>
        setInterval(() => {
          document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);
      </script>
    
    <button onclick="document.getElementById('clickCount').innerText++">Clique aqui</button>
</body>

</html>
